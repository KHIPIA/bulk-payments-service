apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aks-khipia.name" . }}-kv
  labels:
    {{- include "aks-khipia.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.identityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: bbva-client-id
          objectType: secret
        - |
          objectName: bbva-client-secret
          objectType: secret
        - |
          objectName: bbva-private-key-base64
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.bbvaSecretName }}
      type: Opaque
      data:
        - objectName: bbva-client-id
          key: BBVA_CLIENT_ID
        - objectName: bbva-client-secret
          key: BBVA_CLIENT_SECRET
        - objectName: bbva-private-key-base64
          key: BBVA_PRIVATE_KEY_BASE64