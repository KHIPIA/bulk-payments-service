apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aks-khipia.name" . }}
  labels:
    {{- include "aks-khipia.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "aks-khipia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aks-khipia.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: {{ include "aks-khipia.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            {{- range $key := list "BBVA_CLIENT_ID" "BBVA_CLIENT_SECRET" "BBVA_PRIVATE_KEY_BASE64" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.bbvaSecretName }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # quarkus.http.root-path=/api, así que health queda bajo /api/q/health.
          startupProbe:
            httpGet:
              path: /api/q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
